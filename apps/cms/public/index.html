<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOLOCRON Emulator CMS</title><style>body{margin:0;background:#071018;color:#d8eff8;font-family:system-ui}.wrap{max-width:1200px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:14px}header img{width:58px;height:58px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.card{background:#0b1822;border:1px solid #1f4358;border-radius:12px;padding:14px}canvas{display:block;width:100%;max-width:768px;aspect-ratio:8/7;background:#000;image-rendering:pixelated}button,input{background:#102938;color:#def5ff;border:1px solid #2b617d;border-radius:6px;padding:9px;margin:4px}pre{white-space:pre-wrap;overflow:auto;min-height:260px;background:#050b10;padding:10px}.ok{color:#63e6ab}.warn{color:#ffd178}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style><div class="wrap"><header><img src="./assets/holocron-logo.jpg"><div><h1>HOLOCRON Emulator CMS</h1><div class="warn">Distribution candidate — core compatibility qualification still required</div></div></header><div class="grid"><section class="card"><h2>Launch</h2><input id="rom" type="file" accept=".sfc,.smc,.bin"><br><button id="boot">Boot Core</button><button id="run">Run</button><button id="pause">Pause</button><button id="save">Save State</button><button id="load">Load State</button><canvas id="screen" width="256" height="224"></canvas></section><section class="card"><h2 id="status">READY</h2><pre id="log"></pre></section></div></div><script type="module" src="../src/main.js"></script>
